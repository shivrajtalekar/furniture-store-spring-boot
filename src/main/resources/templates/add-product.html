<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product - Furniture Store</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c211b;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            background: #2c211b;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2c211b;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Add New Product</h1>

    <form th:action="@{/products/save}"
          th:object="${product}"
          method="post">

        <label>Product Name</label>

        <input type="text"
               th:field="*{name}"
               placeholder="Enter product name"
               required>

        <label>Category</label>

        <input type="text"
               th:field="*{category}"
               placeholder="Sofa / Bed / Table"
               required>

        <label>Price</label>

        <input type="number"
               step="0.01"
               th:field="*{price}"
               placeholder="Enter price"
               required>

        <label>Description</label>

        <textarea th:field="*{description}"
                  placeholder="Enter product description">
        </textarea>

        <label>Stock</label>

        <input type="number"
               th:field="*{stock}"
               placeholder="Enter stock"
               required>

        <label>Image URL</label>

        <input type="text"
               th:field="*{imageUrl}"
               placeholder="Enter image URL">

        <button type="submit">
            Save Product
        </button>

    </form>

    <a href="/products" class="back">
        ← Back to Products
    </a>

</div>

</body>

</html>
