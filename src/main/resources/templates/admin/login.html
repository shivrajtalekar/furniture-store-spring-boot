<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Furniture Store</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    rgba(17, 24, 39, 0.88),
                    rgba(17, 24, 39, 0.88)
                ),
                url('/images/admin-bg.jpg');

            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 25px 70px rgba(0,0,0,.30);
        }

        .brand {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand h1 {
            font-size: 30px;
            color: #111827;
        }

        .brand h1 span {
            color: #b88746;
        }

        .brand p {
            margin-top: 8px;
            color: #6b7280;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            margin-bottom: 15px;
            padding: 7px 13px;
            border-radius: 20px;
            background: #f3f4f6;
            color: #374151;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .alert {
            padding: 13px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #b88746;
            box-shadow: 0 0 0 3px rgba(184,135,70,.12);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #111827;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #374151;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .register a {
            color: #b88746;
            text-decoration: none;
            font-weight: 700;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #111827;
        }

        .security {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #9ca3af;
            font-size: 12px;
        }

        @media(max-width: 500px) {

            .card {
                padding: 30px 22px;
            }

            .brand h1 {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="brand">

            <div class="badge">
                Customer Login
            </div>

            <h1>
                Furniture<span>Store</span>
            </h1>

            <p>
                Login to manage your orders and shopping account
            </p>

        </div>


        <!-- LOGIN ERROR -->

        <div th:if="${param.error}"
             class="alert error">

            Invalid email or password.

        </div>


        <!-- LOGOUT -->

        <div th:if="${param.logout}"
             class="alert success">

            You have been logged out successfully.

        </div>


        <!-- SUCCESS -->

        <div th:if="${successMessage}"
             class="alert success"
             th:text="${successMessage}">

            Registration successful.

        </div>


        <!-- LOGIN FORM -->

        <form th:action="@{/login}"
              method="post">

            <div class="group">

                <label for="username">
                    Email Address
                </label>

                <input
                    type="email"
                    id="username"
                    name="username"
                    placeholder="Enter your email"
                    autocomplete="username"
                    required>

            </div>


            <div class="group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="login-btn">

                Login to Account

            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a th:href="@{/register}">
                Create Account
            </a>

        </div>


        <a th:href="@{/}"
           class="back">

            ← Back to Store

        </a>


        <div class="security">

            🔒 Your account information is protected

        </div>

    </div>

</div>

</body>

</html>
