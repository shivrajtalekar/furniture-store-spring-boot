<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Furniture Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Edit Product</h1>

        <form th:action="@{/products/save}" th:object="${product}" method="post">

            <input type="hidden" th:field="*{id}">

            <label>Product Name</label>
            <input type="text" th:field="*{name}" required>

            <label>Category</label>
            <input type="text" th:field="*{category}" required>

            <label>Price</label>
            <input type="number" step="0.01" th:field="*{price}" required>

            <label>Quantity</label>
            <input type="number" th:field="*{quantity}" required>

            <label>Description</label>
            <textarea th:field="*{description}"></textarea>

            <label>Image URL</label>
            <input type="text" th:field="*{imageUrl}">

            <label>Stock</label>
            <input type="number" th:field="*{stock}" required>

            <button type="submit">Update Product</button>

        </form>

        <a class="back" href="/products">← Back to Products</a>

    </div>

</body>
</html>
