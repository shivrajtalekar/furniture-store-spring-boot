<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Furniture Store</title>

    <!-- Spring Security CSRF -->
    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .navbar {
            background: #111;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 22px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 45px auto;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 34px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #777;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .card h2 {
            margin-bottom: 22px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #111;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #555;
        }

        .summary-total {
            border-top: 1px solid #ddd;
            padding-top: 18px;
            margin-top: 18px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .payment-box {
            margin-top: 25px;
            padding: 18px;
            border-radius: 10px;
            background: #f4f4f4;
        }

        .payment-box strong {
            display: block;
            margin-bottom: 7px;
        }

        .pay-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 9px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-btn:hover {
            opacity: 0.9;
        }

        .pay-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: #111;
            text-decoration: none;
        }

        .error-message {
            display: none;
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #b00020;
        }

        @media (max-width: 800px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .nav-links {
                display: none;
            }
        }

    </style>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Furniture Store
    </div>

    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/products}">Products</a>
        <a th:href="@{/cart}">Cart</a>
        <a th:href="@{/orders}">My Orders</a>
    </div>

</nav>


<div class="container">

    <div class="page-title">

        <h1>Checkout</h1>

        <p>
            Complete your delivery details and pay securely.
        </p>

    </div>


    <div id="errorMessage"
         class="error-message">
    </div>


    <div class="checkout-grid">


        <!-- ========================= -->
        <!-- DELIVERY DETAILS -->
        <!-- ========================= -->

        <div class="card">

            <h2>Delivery Information</h2>

            <form id="checkoutForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="firstName">
                            First Name *
                        </label>

                        <input type="text"
                               id="firstName"
                               name="firstName"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="lastName">
                            Last Name *
                        </label>

                        <input type="text"
                               id="lastName"
                               name="lastName"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone *
                        </label>

                        <input type="tel"
                               id="phone"
                               name="phone"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               name="email">

                    </div>


                    <div class="form-group full">

                        <label for="address">
                            Address *
                        </label>

                        <textarea id="address"
                                  name="address"
                                  required></textarea>

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City *
                        </label>

                        <input type="text"
                               id="city"
                               name="city"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="state">
                            State *
                        </label>

                        <input type="text"
                               id="state"
                               name="state"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            Pincode *
                        </label>

                        <input type="text"
                               id="pincode"
                               name="pincode"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="country">
                            Country *
                        </label>

                        <input type="text"
                               id="country"
                               name="country"
                               value="India"
                               required>

                    </div>


                    <div class="form-group full">

                        <label for="notes">
                            Order Notes
                        </label>

                        <textarea id="notes"
                                  name="notes"
                                  placeholder="Any special instructions..."></textarea>

                    </div>

                </div>

            </form>

        </div>


        <!-- ========================= -->
        <!-- ORDER SUMMARY -->
        <!-- ========================= -->

        <div class="card">

            <h2>Order Summary</h2>


            <div class="summary-row">

                <span>
                    Items
                </span>

                <strong th:text="${cart.totalItems}">
                    0
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong>
                    ₹<span th:text="${#numbers.formatDecimal(cart.total, 1, 2)}">
                        0.00
                    </span>
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <strong>
                    FREE
                </strong>

            </div>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <span>
                    ₹<span th:text="${#numbers.formatDecimal(cart.total, 1, 2)}">
                        0.00
                    </span>
                </span>

            </div>


            <div class="payment-box">

                <strong>
                    🔒 Secure Online Payment
                </strong>

                <span>
                    Pay securely using Razorpay.
                </span>

            </div>


            <button type="button"
                    id="payButton"
                    class="pay-btn"
                    onclick="startPayment()">

                Pay Securely with Razorpay

            </button>


            <a th:href="@{/cart}"
               class="back-link">

                ← Back to Cart

            </a>

        </div>

    </div>

</div>


<script>

    /*
     * ==========================================
     * CSRF TOKEN
     * ==========================================
     */

    const csrfToken =
        document.querySelector(
            'meta[name="_csrf"]'
        ).getAttribute("content");

    const csrfHeader =
        document.querySelector(
            'meta[name="_csrf_header"]'
        ).getAttribute("content");


    /*
     * ==========================================
     * ERROR MESSAGE
     * ==========================================
     */

    function showError(message) {

        const errorBox =
            document.getElementById("errorMessage");

        errorBox.innerText = message;

        errorBox.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }


    /*
     * ==========================================
     * START RAZORPAY PAYMENT
     * ==========================================
     */

    async function startPayment() {

        const form =
            document.getElementById("checkoutForm");

        if (!form.checkValidity()) {

            form.reportValidity();

            return;
        }


        const payButton =
            document.getElementById("payButton");

        payButton.disabled = true;

        payButton.innerText =
            "Creating secure payment...";


        try {

            /*
             * Create Razorpay Order
             */

            const response =
                await fetch(
                    "/payment/create-order",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json",
                            [csrfHeader]: csrfToken
                        }
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Unable to create payment."
                );
            }


            /*
             * Razorpay Checkout Options
             */

            const options = {

                key: data.keyId,

                amount: data.amount,

                currency: data.currency,

                name: "Furniture Store",

                description:
                    "Furniture Store Order",

                order_id:
                    data.orderId,


                handler:
                    function(paymentResponse) {

                        handlePaymentSuccess(
                            paymentResponse
                        );
                    },


                prefill: {

                    name:
                        document.getElementById(
                            "firstName"
                        ).value
                        + " "
                        +
                        document.getElementById(
                            "lastName"
                        ).value,

                    email:
                        document.getElementById(
                            "email"
                        ).value,

                    contact:
                        document.getElementById(
                            "phone"
                        ).value
                },


                theme: {

                    color: "#111111"
                },


                modal: {

                    ondismiss:
                        function() {

                            payButton.disabled =
                                false;

                            payButton.innerText =
                                "Pay Securely with Razorpay";
                        }
                },


                /*
                 * Payment Failed
                 */

                "payment.failed":
                    function(response) {

                        console.error(
                            "Payment failed:",
                            response
                        );

                        showError(
                            "Payment failed. Please try again."
                        );

                        payButton.disabled =
                            false;

                        payButton.innerText =
                            "Pay Securely with Razorpay";
                    }
            };


            const razorpay =
                new Razorpay(options);


            razorpay.open();


        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Something went wrong."
            );

            payButton.disabled =
                false;

            payButton.innerText =
                "Pay Securely with Razorpay";
        }
    }


    /*
     * ==========================================
     * PAYMENT SUCCESS
     * ==========================================
     */

    async function handlePaymentSuccess(
        paymentResponse
    ) {

        const payButton =
            document.getElementById("payButton");

        payButton.disabled = true;

        payButton.innerText =
            "Verifying payment...";


        try {

            // Save checkout details in session before payment
const checkoutData = new URLSearchParams();

checkoutData.append(
    "firstName",
    document.getElementById("firstName").value
);

checkoutData.append(
    "lastName",
    document.getElementById("lastName").value
);

checkoutData.append(
    "phone",
    document.getElementById("phone").value
);

checkoutData.append(
    "address",
    document.getElementById("address").value
);

checkoutData.append(
    "city",
    document.getElementById("city").value
);

checkoutData.append(
    "state",
    document.getElementById("state").value
);

checkoutData.append(
    "pincode",
    document.getElementById("pincode").value
);

checkoutData.append(
    "country",
    document.getElementById("country").value
);


const saveDetailsResponse =
    await fetch(
        "/checkout/save-details",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded",

                [csrfHeader]:
                    csrfToken
            },

            body: checkoutData.toString()
        }
    );


if (!saveDetailsResponse.ok) {

    throw new Error(
        "Unable to save delivery details."
    );
}

            const response =
                await fetch(
                    "/payment/verify",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            [csrfHeader]:
                                csrfToken
                        },

                        body:
                            JSON.stringify({

                                razorpay_order_id:
                                    paymentResponse
                                        .razorpay_order_id,

                                razorpay_payment_id:
                                    paymentResponse
                                        .razorpay_payment_id,

                                razorpay_signature:
                                    paymentResponse
                                        .razorpay_signature
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Payment verification failed."
                );
            }


            /*
             * Payment successfully verified
             */
window.location.href =
    "/orders/success/" + data.orderId;


        } catch (error) {

            console.error(error);

            showError(
                error.message ||
                "Unable to verify payment."
            );

            payButton.disabled =
                false;

            payButton.innerText =
                "Pay Securely with Razorpay";
        }
    }

</script>

</body>

</html>
